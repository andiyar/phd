<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAF7F2">
<title>DREAMS — Theme Matrix</title>
<link rel="stylesheet" href="progress-widget.css">
<script defer src="progress-widget.js"></script>
<script>
  // Mobile redirect — matrix is a desktop-only view.
  (function () {
    if (sessionStorage.getItem("dreams_force_desktop") === "1") return;
    var mq = window.matchMedia("(max-width: 880px)");
    if (mq.matches) {
      window.location.replace("mobile.html");
      return;
    }
    var onChange = function (e) {
      if (e.matches && sessionStorage.getItem("dreams_force_desktop") !== "1") {
        window.location.replace("mobile.html");
      }
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  })();
</script>
<style>
  /* ---------- Design tokens (matches viewer) ---------- */
  :root {
    --paper:        #FAF7F2;
    --paper-2:      #F4EFE6;
    --ink:          #1C1D22;
    --ink-2:        #4A4B53;
    --ink-3:        #8A8B91;
    --line:         #E6E1D6;
    --line-2:       #D6D0C2;
    --accent:       #2E3033;
    --highlight:    #FFE9A8;

    --d-comm:       #B07B2E;  --d-comm-bg:    #F4E9D2;  --d-comm-soft:  #FBF4E2;
    --d-symp:       #B14A3F;  --d-symp-bg:    #F2D8D2;  --d-symp-soft:  #FAE7E2;
    --d-fam:        #4F7A4E;  --d-fam-bg:     #DEE9D9;  --d-fam-soft:   #ECF2E7;
    --d-pcc:        #6B5391;  --d-pcc-bg:     #E1D9EB;  --d-pcc-soft:   #EFE9F4;
    --d-out:        #6E6F77;  --d-out-bg:     #DEDED9;  --d-out-soft:   #ECECE7;

    /* Theme palette (codebook v2) — t1..t4 themes, t0 deprecated/unthemed.
       Slugs key the CSS, so renaming a theme never touches this stylesheet. */
    --t1:  var(--d-comm);  --t1-bg:  var(--d-comm-bg);  --t1-soft:  var(--d-comm-soft);
    --t2:  var(--d-pcc);   --t2-bg:  var(--d-pcc-bg);   --t2-soft:  var(--d-pcc-soft);
    --t3:  var(--d-symp);  --t3-bg:  var(--d-symp-bg);  --t3-soft:  var(--d-symp-soft);
    --t4:  var(--d-fam);   --t4-bg:  var(--d-fam-bg);   --t4-soft:  var(--d-fam-soft);
    --t0:  var(--d-out);   --t0-bg:  var(--d-out-bg);   --t0-soft:  var(--d-out-soft);

    --arm-dxm:      #2F5D8B;  --arm-dxm-bg:   #DAE5EE;
    --arm-mdz:      #8B5A2F;  --arm-mdz-bg:   #EFE3D5;

    --heat:         #2F5D8B;
    --heat-bg:      #DAE5EE;

    --shadow-sm:    0 1px 2px rgba(28,29,34,.04), 0 1px 1px rgba(28,29,34,.03);
    --shadow:       0 4px 14px rgba(28,29,34,.06), 0 2px 4px rgba(28,29,34,.04);
    --shadow-lg:    0 18px 40px rgba(28,29,34,.10), 0 4px 10px rgba(28,29,34,.05);

    --radius-sm:    6px;
    --radius:       10px;
    --radius-lg:    16px;

    --ui:           -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    --serif:        "Iowan Old Style", "Palatino", "Charter", "Georgia", "Times New Roman", serif;
    --mono:         ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;

    --topbar-h:     58px;
    --controls-h:   54px;
    --rail-h:       50px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:      #16171B;
      --paper-2:    #1E1F24;
      --ink:        #ECEAE3;
      --ink-2:      #B5B4AE;
      --ink-3:      #76777E;
      --line:       #2A2B30;
      --line-2:     #353740;
      --accent:     #ECEAE3;
      --highlight:  #6B5414;

      --d-comm:     #E1B868;  --d-comm-bg:    #3D3220;  --d-comm-soft:  #2A2418;
      --d-symp:     #E58B7E;  --d-symp-bg:    #402523;  --d-symp-soft:  #2C1B1A;
      --d-fam:      #99C18F;  --d-fam-bg:     #243321;  --d-fam-soft:   #1B2519;
      --d-pcc:      #B4A3DC;  --d-pcc-bg:     #2D2940;  --d-pcc-soft:   #211E2E;
      --d-out:      #B4B5BB;  --d-out-bg:     #2C2D32;  --d-out-soft:   #212126;

      --arm-dxm:    #8AB4D9;  --arm-dxm-bg:   #1F2D3B;
      --arm-mdz:    #D2A57A;  --arm-mdz-bg:   #34281C;

      --heat:       #8AB4D9;
      --heat-bg:    #1F2D3B;
    }
  }

  /* ---------- Reset / base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body.drawer-open { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  ::selection { background: var(--highlight); color: var(--ink); }

  /* ---------- Top bar ---------- */
  header.topbar {
    position: sticky; top: 0; z-index: 30;
    height: var(--topbar-h);
    display: flex; align-items: center; gap: 18px;
    padding: 0 24px;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: saturate(1.2) blur(14px);
    -webkit-backdrop-filter: saturate(1.2) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex; align-items: baseline; gap: 10px;
    user-select: none;
    flex-shrink: 0;
  }
  .brand .mark {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    letter-spacing: .01em;
    color: var(--ink);
  }
  .brand .mark::first-letter { color: var(--d-symp); }
  .brand .sub {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .nav-back {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line);
    background: var(--paper-2);
    color: var(--ink-2);
    text-decoration: none;
    height: 32px;
    padding: 0 12px;
    border-radius: 999px;
    font-size: 12.5px;
  }
  .nav-back:hover { background: var(--paper); color: var(--ink); border-color: var(--line-2); }
  .nav-back .arrow {
    width: 12px; height: 12px;
    background: currentColor;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M19 12H6m6-7-7 7 7 7'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M19 12H6m6-7-7 7 7 7'/></svg>") center/contain no-repeat;
  }
  .topbar .spacer { flex: 1; }
  .topbar .count {
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    font-size: 12.5px;
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .topbar .count strong { color: var(--ink); font-weight: 600; }

  /* ---------- Controls bar ---------- */
  .controls {
    position: sticky;
    top: var(--topbar-h);
    z-index: 25;
    display: flex; align-items: center; gap: 12px;
    min-height: var(--controls-h);
    padding: 0 24px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    row-gap: 8px;
  }
  .ctl {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink-2);
    font-size: 13px;
  }
  .ctl label { color: var(--ink-3); font-size: 12px; letter-spacing: .04em; }
  .ctl select {
    height: 32px;
    padding: 0 28px 0 12px;
    border: 1px solid var(--line);
    background: var(--paper-2);
    color: var(--ink);
    border-radius: 8px;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='%238A8B91' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='m6 9 6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 14px;
    cursor: pointer;
    font-size: 13px;
  }
  .ctl select:focus { outline: none; border-color: var(--ink-3); }

  .seg {
    display: inline-flex;
    border: 1px solid var(--line);
    background: var(--paper-2);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg button {
    background: transparent;
    border: 0;
    height: 30px;
    padding: 0 11px;
    font-size: 12.5px;
    color: var(--ink-2);
    border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
  }
  .seg button:hover:not([aria-pressed="true"]) { background: var(--paper); color: var(--ink); }

  .ctl .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px;
    padding: 0 11px;
    border: 1px solid var(--line);
    background: var(--paper-2);
    color: var(--ink-2);
    border-radius: 8px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .ctl .toggle[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* ---------- Filter rail ---------- */
  .rail {
    position: sticky;
    top: calc(var(--topbar-h) + var(--controls-h-actual, var(--controls-h)));
    z-index: 20;
    background: var(--paper-2);
    border-bottom: 1px solid var(--line);
    padding: 8px 24px;
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
    min-height: var(--rail-h);
  }
  .rail .label {
    color: var(--ink-3);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .rail .add-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px dashed var(--line-2);
    background: transparent;
    color: var(--ink-2);
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    font-size: 12.5px;
    position: relative;
  }
  .rail .add-btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .rail .add-btn .plus {
    width: 12px; height: 12px;
    background: currentColor;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' d='M12 5v14M5 12h14'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' d='M12 5v14M5 12h14'/></svg>") center/contain no-repeat;
  }
  .rail .clear-all {
    border: 0; background: transparent;
    color: var(--ink-3);
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .rail .clear-all:hover { color: var(--ink); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 6px 3px 10px;
    font-size: 12.5px;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .chip .k { color: var(--ink-3); margin-right: 2px; }
  .chip .v { color: var(--ink); font-weight: 500; }
  .chip .x {
    border: 0; background: transparent;
    width: 18px; height: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--ink-3);
    line-height: 1;
    font-size: 14px;
  }
  .chip .x:hover { background: var(--paper-2); color: var(--ink); }
  .chip .v.has-multi { color: var(--ink); }
  .chip .v .more { color: var(--ink-3); margin-left: 2px; font-weight: 400; }

  /* ---------- Filter popover (for "Add filter") ---------- */
  .pop {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 50;
    width: 380px;
    max-width: 92vw;
    max-height: 70vh;
    display: flex; flex-direction: column;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
  }
  .pop[hidden] { display: none; }
  .pop .pop-search {
    width: calc(100% - 12px);
    margin: 8px 6px 4px;
    height: 32px;
    border: 1px solid var(--line);
    background: var(--paper-2);
    color: var(--ink);
    border-radius: 8px;
    padding: 0 10px;
    font-size: 13px;
    flex-shrink: 0;
  }
  .pop .pop-search:focus { outline: none; border-color: var(--ink-3); }
  .pop-body {
    overflow-y: auto;
    padding: 4px 6px 8px;
    flex: 1;
  }
  .pop details.pop-section {
    border-bottom: 1px solid var(--line);
    padding: 0;
  }
  .pop details.pop-section:last-child { border-bottom: 0; }
  .pop details.pop-section > summary {
    list-style: none;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 8px;
    font-size: 11.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-2);
    font-weight: 600;
    user-select: none;
    border-radius: 6px;
  }
  .pop details.pop-section > summary:hover { background: var(--paper-2); color: var(--ink); }
  .pop details.pop-section > summary::-webkit-details-marker { display: none; }
  .pop details.pop-section > summary::after {
    content: "";
    width: 8px; height: 8px;
    border-right: 1.5px solid var(--ink-3);
    border-bottom: 1.5px solid var(--ink-3);
    transform: rotate(45deg) translate(-1px, -1px);
    transition: transform .15s;
    margin-left: 8px;
  }
  .pop details.pop-section[open] > summary::after { transform: rotate(-135deg) translate(-1px, -1px); }
  .pop details.pop-section > summary .label { flex: 1; }
  .pop details.pop-section > summary .sel-badge {
    background: var(--ink);
    color: var(--paper);
    font-size: 10.5px;
    font-weight: 700;
    min-width: 18px; height: 18px;
    border-radius: 999px;
    padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }
  .pop details.pop-section > summary .sel-badge:empty { display: none; }
  .pop .pop-options { padding: 2px 4px 8px; }
  .pop .pop-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
    user-select: none;
  }
  .pop .pop-item:hover { background: var(--paper-2); }
  .pop .pop-item input { margin: 0; accent-color: var(--ink); flex-shrink: 0; }
  .pop .pop-item .swatch {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ink-3);
    flex-shrink: 0;
  }
  .pop .pop-item .label { flex: 1; }
  .pop .pop-item .n {
    font-size: 11.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .pop .pop-item[data-checked="true"] { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .pop .pop-item[data-checked="true"] .label { font-weight: 600; }

  /* ---------- Matrix table ---------- */
  main {
    padding: 18px 24px 80px;
  }
  .matrix-meta {
    margin: 0 0 12px;
    color: var(--ink-3);
    font-size: 12.5px;
    display: flex; align-items: baseline; gap: 16px;
    flex-wrap: wrap;
  }
  .matrix-meta strong { color: var(--ink); font-weight: 600; }
  .matrix-meta .legend {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: auto;
  }
  .matrix-meta .legend .bar {
    width: 100px; height: 8px;
    border-radius: 4px;
    background: linear-gradient(to right, var(--paper-2), var(--heat));
    border: 1px solid var(--line);
  }
  .matrix-meta .legend .end {
    font-variant-numeric: tabular-nums;
  }

  .matrix-wrap {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    overflow: auto;
    max-height: calc(100vh - var(--topbar-h) - var(--controls-h) - var(--rail-h) - 100px);
    box-shadow: var(--shadow-sm);
  }

  table.matrix {
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    width: 100%;
  }
  table.matrix th, table.matrix td {
    padding: 8px 10px;
    text-align: right;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  table.matrix th { font-weight: 600; }
  table.matrix th:first-child, table.matrix td:first-child {
    text-align: left;
    position: sticky;
    left: 0;
    z-index: 4;
    background: var(--paper);
    border-right: 1px solid var(--line-2);
    min-width: 220px;
    max-width: 360px;
  }
  table.matrix thead th {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper-2);
    color: var(--ink-2);
    font-size: 12px;
    letter-spacing: .04em;
  }
  table.matrix thead th:first-child { z-index: 6; background: var(--paper-2); }
  table.matrix thead th.col-total {
    color: var(--ink);
    background: var(--paper-2);
    border-left: 1px solid var(--line-2);
  }
  table.matrix .row-label .label-row {
    display: flex; align-items: center; gap: 8px;
  }
  table.matrix .row-label .label-row .swatch {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  /* Deprecated/unthemed row — the audit bucket, visibly demoted */
  table.matrix tr.row-deprecated td:first-child { color: var(--ink-3); font-style: italic; }
  table.matrix tr.row-deprecated td { color: var(--ink-3); }
  table.matrix tbody tr:hover td { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  table.matrix tbody tr:hover td:first-child {
    background: color-mix(in srgb, var(--ink) 4%, var(--paper));
  }

  table.matrix td.cell {
    cursor: pointer;
    transition: filter .12s;
    color: var(--ink);
  }
  table.matrix td.cell.empty { color: var(--ink-3); cursor: default; }
  table.matrix td.cell:hover:not(.empty) { filter: brightness(.97); }
  table.matrix td.cell.col-total {
    background: var(--paper-2);
    color: var(--ink);
    font-weight: 600;
    border-left: 1px solid var(--line-2);
  }
  table.matrix tfoot td {
    background: var(--paper-2);
    color: var(--ink);
    font-weight: 700;
    border-top: 1px solid var(--line-2);
  }
  table.matrix tfoot td:first-child {
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: 11.5px;
  }

  table.matrix .pct-suffix { color: var(--ink-3); margin-left: 2px; font-size: 11px; }

  /* ---------- E1: Arm-coloured patient rows ---------- */
  table.matrix tr.arm-DXM td:first-child {
    background: linear-gradient(to right,
      color-mix(in srgb, var(--arm-dxm-bg) 85%, var(--paper)) 0%,
      var(--paper) 100%);
    box-shadow: inset 3px 0 0 var(--arm-dxm);
  }
  table.matrix tr.arm-MDZ td:first-child {
    background: linear-gradient(to right,
      color-mix(in srgb, var(--arm-mdz-bg) 85%, var(--paper)) 0%,
      var(--paper) 100%);
    box-shadow: inset 3px 0 0 var(--arm-mdz);
  }
  /* Tint the rest of the row very subtly to reinforce arm clustering */
  table.matrix tr.arm-DXM td:not(:first-child):not(.col-total) {
    background-color: color-mix(in srgb, var(--arm-dxm-bg) 16%, transparent);
  }
  table.matrix tr.arm-MDZ td:not(:first-child):not(.col-total) {
    background-color: color-mix(in srgb, var(--arm-mdz-bg) 16%, transparent);
  }
  /* Hover state preserves arm tint */
  table.matrix tbody tr.arm-DXM:hover td:first-child {
    background:
      linear-gradient(to right,
        color-mix(in srgb, var(--arm-dxm-bg) 95%, var(--paper)) 0%,
        color-mix(in srgb, var(--ink) 4%, var(--paper)) 100%);
  }
  table.matrix tbody tr.arm-MDZ:hover td:first-child {
    background:
      linear-gradient(to right,
        color-mix(in srgb, var(--arm-mdz-bg) 95%, var(--paper)) 0%,
        color-mix(in srgb, var(--ink) 4%, var(--paper)) 100%);
  }

  /* ---------- E2: Presence mode ---------- */
  table.matrix.presence td.cell {
    text-align: center;
    padding: 6px 10px;
  }
  table.matrix.presence td.cell .pdot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--ink-2);
    vertical-align: middle;
    box-shadow: 0 0 0 1.5px color-mix(in srgb, currentColor 18%, transparent);
  }
  /* In presence mode, suppress the heat-blue legend bar */
  .matrix-meta.presence-mode .legend { display: none; }

  /* ---------- Split-by-arm ---------- */
  .matrix-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  .matrix-split .split-pane {
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .matrix-split .split-head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 2px 8px;
  }
  .matrix-split .split-head .arm-tag {
    font-family: var(--serif);
    font-style: italic;
    font-size: 17px;
    letter-spacing: .005em;
  }
  .matrix-split .split-head .arm-tag .dot {
    display: inline-block; width: 9px; height: 9px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: 1px;
  }
  .matrix-split .split-head .arm-tag.DXM { color: var(--arm-dxm); }
  .matrix-split .split-head .arm-tag.MDZ { color: var(--arm-mdz); }
  .matrix-split .split-head .arm-tag.DXM .dot { background: var(--arm-dxm); }
  .matrix-split .split-head .arm-tag.MDZ .dot { background: var(--arm-mdz); }
  .matrix-split .split-head .arm-sub {
    color: var(--ink-3);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
  }
  .matrix-split .matrix-wrap {
    max-height: calc(100vh - var(--topbar-h) - var(--controls-h) - var(--rail-h) - 140px);
  }
  @media (max-width: 1100px) {
    .matrix-split { grid-template-columns: 1fr; }
  }

  /* ---------- E4: Day-trajectory view ---------- */
  table.trajectory {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    font-size: 13px;
  }
  table.trajectory th, table.trajectory td {
    padding: 8px 10px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  table.trajectory thead th {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper-2);
    color: var(--ink-2);
    font-size: 12px;
    letter-spacing: .04em;
    text-align: center;
  }
  table.trajectory th:first-child, table.trajectory td:first-child {
    position: sticky; left: 0; z-index: 4;
    background: var(--paper);
    border-right: 1px solid var(--line-2);
    min-width: 90px;
    max-width: 110px;
    white-space: nowrap;
    font-weight: 600;
  }
  table.trajectory thead th:first-child { z-index: 6; background: var(--paper-2); }

  table.trajectory tr.arm-DXM td:first-child {
    background: linear-gradient(to right,
      color-mix(in srgb, var(--arm-dxm-bg) 85%, var(--paper)) 0%,
      var(--paper) 100%);
    box-shadow: inset 3px 0 0 var(--arm-dxm);
  }
  table.trajectory tr.arm-MDZ td:first-child {
    background: linear-gradient(to right,
      color-mix(in srgb, var(--arm-mdz-bg) 85%, var(--paper)) 0%,
      var(--paper) 100%);
    box-shadow: inset 3px 0 0 var(--arm-mdz);
  }
  table.trajectory tr.arm-DXM td:not(:first-child) {
    background-color: color-mix(in srgb, var(--arm-dxm-bg) 12%, transparent);
  }
  table.trajectory tr.arm-MDZ td:not(:first-child) {
    background-color: color-mix(in srgb, var(--arm-mdz-bg) 12%, transparent);
  }

  table.trajectory td.tr-cell {
    min-width: 140px;
    cursor: pointer;
  }
  table.trajectory td.tr-cell.empty { cursor: default; color: var(--ink-3); }
  table.trajectory td.tr-cell:hover:not(.empty) { filter: brightness(.97); }

  .tr-chips {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .tr-chip {
    --c: var(--ink-3);
    --c-bg: var(--paper-2);
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--c-bg);
    color: var(--c);
    border: 1px solid color-mix(in srgb, var(--c) 22%, transparent);
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tr-chip .n {
    color: color-mix(in srgb, var(--c) 60%, var(--ink-3));
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    font-size: 10px;
  }
  .tr-chip.t1 { --c: var(--t1); --c-bg: var(--t1-bg); }
  .tr-chip.t2 { --c: var(--t2); --c-bg: var(--t2-bg); }
  .tr-chip.t3 { --c: var(--t3); --c-bg: var(--t3-bg); }
  .tr-chip.t4 { --c: var(--t4); --c-bg: var(--t4-bg); }
  .tr-chip.t0 { --c: var(--t0); --c-bg: var(--t0-bg); }
  .tr-chip.t0.is-deprecated { border-style: dashed; text-decoration: line-through; }

  .traj-legend {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin: 0 2px 12px;
    font-size: 12px;
    color: var(--ink-3);
  }
  .traj-legend .swatch {
    display: inline-block; width: 9px; height: 9px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: 1px;
  }
  .traj-legend .note {
    margin-left: auto;
    font-style: italic;
    color: var(--ink-3);
    font-size: 11.5px;
  }

  /* ---------- PCA layer (trajectory + drawer) ---------- */
  /* PCA reasons appear on their own quiet row below the code chips */
  .tr-chip.pca {
    background: transparent;
    color: var(--ink-3);
    border: 0;
    padding: 0;
    font-weight: 500;
    font-size: 10.5px;
    border-radius: 0;
    line-height: 1.2;
  }
  .tr-chip.pca::before {
    content: "✓";
    margin-right: 3px;
    font-size: 9px;
    color: var(--ink-3);
    font-weight: 700;
    opacity: .85;
  }
  .tr-chip.pca:hover {
    color: var(--ink);
  }
  .tr-chip.pca:hover::before {
    color: var(--ink-2);
  }
  .tr-row-pca {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px 10px;
    margin-top: 5px;
    padding-top: 4px;
    border-top: 1px dashed color-mix(in srgb, var(--ink-3) 28%, transparent);
  }
  /* When PCA row is the only thing in the cell (pure PCA mode, no codes), drop the divider */
  .tr-row-pca:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: 0;
  }
  .traj-legend .swatch.pca {
    border-radius: 2px;
    background: transparent;
    border: 0;
    color: var(--ink-3);
    font-weight: 700;
    font-size: 10px;
    width: auto;
    height: auto;
    margin-right: 4px;
  }
  .traj-legend .swatch.pca::before { content: "✓"; }
  .traj-legend .swatch.score {
    border-radius: 2px;
    background: linear-gradient(to right,
      color-mix(in srgb, var(--accent) 5%, transparent),
      color-mix(in srgb, var(--accent) 60%, transparent));
    width: 30px;
  }
  table.trajectory td.tr-cell[data-score-tint] {
    background-image: linear-gradient(
      color-mix(in srgb, var(--accent) calc(var(--score-pct, 0) * 0.55%), transparent),
      color-mix(in srgb, var(--accent) calc(var(--score-pct, 0) * 0.55%), transparent));
  }
  .tr-score-badge {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--accent) 9%, transparent);
    border-radius: 3px;
    padding: 1px 5px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  /* Trajectory mode segmented control — visible only when in trajectory view */
  .ctl.traj-only { display: none; }
  body.view-trajectory .ctl.traj-only { display: inline-flex; }
  /* Matrix-only controls — hide entirely in trajectory view (they're not meaningful) */
  body.view-trajectory .ctl.matrix-only { display: none; }

  /* Drawer: PCA context toggle in head */
  .drawer-pca-toggle {
    position: absolute;
    top: 14px;
    right: 56px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-2);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    user-select: none;
  }
  .drawer-pca-toggle::before {
    content: "✓";
    font-size: 10px;
    color: var(--ink-3);
  }
  .drawer-pca-toggle[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
    color: var(--ink);
  }
  .drawer-pca-toggle[aria-pressed="true"]::before { color: var(--accent); }
  .drawer-pca-toggle[hidden] { display: none !important; }

  /* Drawer: PCA form-context block */
  .pca-form-group {
    margin: 14px 0 6px;
  }
  .pca-form-group:first-child { margin-top: 0; }
  .pca-context-block {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .pca-context-block .ctx-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .pca-context-block .ctx-head .score {
    margin-left: auto;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--ink);
  }
  .pca-context-block .ctx-head .sep {
    color: var(--ink-3);
    font-weight: 400;
  }
  .pca-context-block .ctx-line {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
    margin-top: 2px;
  }
  .pca-context-block .ctx-line .lbl {
    color: var(--ink-3);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-right: 2px;
    align-self: center;
  }
  .pca-context-block .reason-pill {
    background: var(--paper);
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11.5px;
    color: var(--ink-2);
  }
  .pca-context-block .behav-item {
    font-size: 11.5px;
    color: var(--ink-2);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 7px;
    font-variant-numeric: tabular-nums;
  }
  .pca-context-block .behav-item .n {
    font-weight: 700;
    color: var(--ink);
    margin-left: 4px;
  }
  .pca-context-block.missing {
    border-style: dashed;
    color: var(--ink-3);
    font-style: italic;
  }
  .pca-other-divider {
    margin: 18px 0 8px;
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--ink-3);
    text-transform: uppercase;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }

  /* ---------- Export menu ---------- */
  /* Anchor the download menu to the far-right edge of the controls bar
     so it sits in a deliberate spot rather than wherever flex leaves it. */
  #downloadMenu { margin-left: auto; }
  .ctl .toggle.icon-only {
    width: 32px;
    padding: 0;
    justify-content: center;
    color: var(--ink-2);
  }
  .ctl .toggle.icon-only:hover { color: var(--ink); }
  .menu-wrap { position: relative; display: inline-flex; }
  .menu-wrap .menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 50;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 6px;
    min-width: 200px;
    display: none;
  }
  .menu-wrap.open .menu { display: block; }
  .menu-wrap .menu button {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    border: 0; background: transparent; color: var(--ink);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    text-align: left;
  }
  .menu-wrap .menu button:hover { background: var(--paper-2); }
  .menu-wrap .menu button .ext {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    margin-left: auto;
  }

  /* Disabled control look */
  .ctl.is-disabled,
  .ctl button.is-disabled {
    opacity: .4;
    pointer-events: none;
  }

  /* Theme-coloured headers when columns = theme */
  table.matrix thead th.col-t1 { color: var(--t1); }
  table.matrix thead th.col-t2 { color: var(--t2); }
  table.matrix thead th.col-t3 { color: var(--t3); }
  table.matrix thead th.col-t4 { color: var(--t4); }
  table.matrix thead th.col-t0 { color: var(--t0); }

  /* Empty / loading */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-3);
  }
  .empty .title {
    font-family: var(--serif);
    font-style: italic;
    font-size: 18px;
    color: var(--ink-2);
    margin-bottom: 6px;
  }

  /* ---------- Drawer ---------- */
  .drawer-backdrop {
    position: fixed; inset: 0;
    background: rgba(28,29,34,.35);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(540px, 90vw);
    background: var(--paper);
    border-left: 1px solid var(--line);
    box-shadow: -16px 0 40px rgba(28,29,34,.10);
    z-index: 90;
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.32,.72,0,1);
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .drawer-head .meta {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 4px;
  }
  .drawer-head h2 {
    margin: 0 0 4px;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    display: flex; align-items: baseline; gap: 8px;
    flex-wrap: wrap;
  }
  .drawer-head h2 .x-mark { color: var(--ink-3); font-weight: 400; }
  .drawer-head .sub {
    color: var(--ink-3);
    font-size: 12.5px;
  }
  .drawer-head .close {
    position: absolute; top: 14px; right: 14px;
    border: 0; background: transparent;
    color: var(--ink-3);
    width: 30px; height: 30px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .drawer-head .close:hover { background: var(--paper-2); color: var(--ink); }
  .drawer-search-wrap {
    position: relative;
    margin-top: 12px;
  }
  .drawer-search {
    width: 100%;
    height: 34px;
    border: 1px solid var(--line);
    background: var(--paper-2);
    color: var(--ink);
    border-radius: 8px;
    padding: 0 32px 0 32px;
    font-size: 13px;
  }
  .drawer-search:focus { outline: none; border-color: var(--ink-3); background: var(--paper); }
  .drawer-search-wrap::before {
    content: "";
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px;
    background: currentColor;
    color: var(--ink-3);
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='black' stroke-width='2' stroke-linecap='round' d='M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm6.5-1.5L21 21'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='black' stroke-width='2' stroke-linecap='round' d='M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm6.5-1.5L21 21'/></svg>") center/contain no-repeat;
    pointer-events: none;
  }
  .drawer-search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent;
    color: var(--ink-3);
    width: 22px; height: 22px;
    border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1;
  }
  .drawer-search-clear:hover { background: var(--paper); color: var(--ink); }
  .drawer-search-wrap.has-value .drawer-search-clear { display: inline-flex; }

  .drawer-body mark {
    background: var(--highlight);
    color: var(--ink);
    padding: 0 1px;
    border-radius: 2px;
  }
  .drawer-card[hidden] { display: none; }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 20px;
  }
  .drawer-card {
    --c: var(--d-out);
    --c-bg: var(--d-out-bg);
    --c-soft: var(--d-out-soft);
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid var(--c);
    border-radius: var(--radius);
    padding: 12px 14px 12px 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
  }
  .drawer-card[data-theme="t1"] { --c: var(--t1); --c-bg: var(--t1-bg); --c-soft: var(--t1-soft); }
  .drawer-card[data-theme="t2"] { --c: var(--t2); --c-bg: var(--t2-bg); --c-soft: var(--t2-soft); }
  .drawer-card[data-theme="t3"] { --c: var(--t3); --c-bg: var(--t3-bg); --c-soft: var(--t3-soft); }
  .drawer-card[data-theme="t4"] { --c: var(--t4); --c-bg: var(--t4-bg); --c-soft: var(--t4-soft); }
  .drawer-card[data-theme="t0"] { --c: var(--t0); --c-bg: var(--t0-bg); --c-soft: var(--t0-soft); }
  /* Deprecated quote — retained for audit (D12/D13), never deleted */
  .drawer-card.deprecated {
    --c: var(--t0); --c-bg: var(--t0-bg); --c-soft: var(--t0-soft);
    background: color-mix(in srgb, var(--paper-2) 70%, var(--paper));
    border-style: dashed;
    border-left-style: solid;
    box-shadow: none;
  }
  .drawer-card.deprecated .quote {
    color: var(--ink-3);
    text-decoration: line-through;
    text-decoration-thickness: from-font;
    text-decoration-color: color-mix(in srgb, var(--ink-3) 45%, transparent);
  }
  .drawer-card.deprecated .domain { color: var(--ink-3); }
  .drawer-card .meta .pill.prov {
    background: transparent;
    border-style: dashed;
    border-color: var(--line-2);
    color: var(--ink-3);
  }
  .drawer-card .meta .pill.prov::before {
    content: "v1 ";
    font-family: var(--mono);
    font-size: 9px;
    opacity: .8;
  }
  .drawer-card .meta .pill.dep {
    background: var(--t0-bg);
    color: var(--ink-2);
    border-color: color-mix(in srgb, var(--ink-3) 35%, transparent);
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .drawer-card .head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 6px;
    gap: 10px;
  }
  .drawer-card .domain {
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--c);
  }
  .drawer-card .id {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
  }
  .drawer-card .quote {
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.45;
    color: var(--ink);
    margin: 0;
  }
  .drawer-card .note {
    margin-top: 8px;
    padding: 6px 10px;
    background: var(--c-soft);
    border-left: 2px solid var(--c);
    border-radius: 4px;
    font-size: 12.5px;
    color: var(--ink-2);
    font-style: italic;
  }
  .drawer-card .meta {
    margin-top: 8px;
    display: flex; flex-wrap: wrap; gap: 5px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .drawer-card .meta .pill {
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--paper-2);
    color: var(--ink-2);
    border: 1px solid var(--line);
  }
  .drawer-card .meta .pill.stream {
    background: var(--c-bg);
    color: var(--c);
    border-color: color-mix(in srgb, var(--c) 22%, transparent);
    font-weight: 600;
  }

<div id="gate">
  <div class="box">
    <div class="title">DREAMS</div>
    <div class="sub">Qualitative Coding Database</div>
    <input id="gate-input" type="password" placeholder="Password" autocomplete="current-password" />
    <div id="gate-err" class="err"></div>
    <button id="gate-submit">Enter</button>
  </div>
</div>
<script>
  (function () {
    var PW = "DREAMS2026";
    var gate = document.getElementById("gate");
    var input = document.getElementById("gate-input");
    var err = document.getElementById("gate-err");
    if (sessionStorage.getItem("dreams_auth") === "1") {
      gate.style.display = "none";
    }
    function check() {
      if (input.value === PW) {
        sessionStorage.setItem("dreams_auth", "1");
        gate.style.display = "none";
      } else {
        err.textContent = "Incorrect password.";
        input.value = "";
        input.focus();
      }
    }
    document.getElementById("gate-submit").addEventListener("click", check);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  })();
</script>
