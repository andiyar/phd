<script>
(() => {
  "use strict";

  // ================= THEME FRAMEWORK CONFIG =================
  // Codebook v2 · DECISIONS D14 (23-Jul-2026). These are WORKING labels —
  // supervisor lock pending at the 26-Aug-2026 meeting.
  //
  // `key`   must equal the `theme` value stored in coded_quotes.json
  // `label` is what this viewer displays (matrix rows/cols, drawer, exports)
  // `short` is used where horizontal space is tight (trajectory chips)
  // `slug`  keys the CSS colour (t1..t4, t0 = no theme) — never a label, so a
  //         rename is a one-line edit here and nothing else in this file.
  const THEMES = [
    { key: "Comfort through Preserved Awareness",  label: "Comfort through Preserved Awareness",  short: "Awareness",      slug: "t1" },
    { key: "Comfort through Deep Settling",        label: "Comfort through Deep Settling",        short: "Deep Settling",  slug: "t2" },
    { key: "Nature of Distress Observed",          label: "Nature of Distress Observed",          short: "Distress",       slug: "t3" },
    { key: "Rousable or Responsive Communication", label: "Rousable or Responsive Communication", short: "Rousable comms", slug: "t4" },
  ];
  // Every deprecated row lands here: themes were only assigned to the in-scope
  // corpus at the D14 sort.
  const NO_THEME = { key: "— no theme", label: "— no theme (deprecated)", short: "no theme", slug: "t0" };
  // Stream = cross-cutting voice, derived not coded (codebook v2)
  const STREAMS = [
    { key: "staff",             label: "Staff (clinical documentation)" },
    { key: "family (reported)", label: "Family (reported in notes)" },
    { key: "family (PCA)",      label: "Family (PCA form)" },
  ];
  const NO_STREAM = { key: "— no stream", label: "— no stream" };
  // ==========================================================

  const THEME_BY_KEY = new Map(THEMES.map(t => [t.key, t]));
  const themeMeta    = (v) => THEME_BY_KEY.get(v) || NO_THEME;
  const THEME_ORDER  = [...THEMES.map(t => t.key), NO_THEME.key];
  const STREAM_ORDER = [...STREAMS.map(s => s.key), NO_STREAM.key];
  const STREAM_LABEL = new Map(STREAMS.map(s => [s.key, s.label]));

  // ---------- Config ----------
  const FACETS = [
    { key: "theme",      label: "Theme",  coloured: true },
    { key: "arm",        label: "Arm"     },
    { key: "stream",     label: "Stream"  },
    { key: "day",        label: "Day"     },
    { key: "discipline", label: "Source"  },
    { key: "patient",    label: "Patient" },
  ];
  const FACET_LABEL = Object.fromEntries(FACETS.map(f => [f.key, f.label]));

  const DAY_ORDER = ["DayMinus1", "Day0", "Day1", "Day2", "Day3", "Day4", "Day5"];
  const ARM_ORDER = ["DXM", "MDZ"];
  const DISCIPLINE_ORDER = ["Medical", "Nursing", "PCA"];

  // Dimension value for an item — theme and stream are normalised so rows that
  // carry neither (deprecated ones) still pivot somewhere honest.
  function facetValue(it, key) {
    if (key === "theme")  return it.theme  || NO_THEME.key;
    if (key === "stream") return it.stream || NO_STREAM.key;
    return it[key];
  }
  const isDeprecated = (it) => it.status === "deprecated";

  // ---------- State ----------
  const LS_TRAJMODE = "dreams.trajMode";
  const LS_PCACTX   = "dreams.pcaContextOn";
  const BEHAVIOUR_ORDER = ["Grimacing", "Groaning", "Shouting", "Touching", "Purposeless movements", "Laboured breathing"];

  const state = {
    data: [],
    pcaByFile: new Map(),        // source_file -> pca entry
    pcaByPatientDay: new Map(),  // patient -> day -> [pca entries]
    scope: {},                   // { facet: Set<value> }
    rowDim: "theme",             // framework default: theme × arm
    colDim: "arm",
    norm: "count",               // count | pctcol | pctrow | presence
    sort: "natural",             // natural | prevalence
    showDeprecated: false,       // default view = in_scope only
    patientArm: {},              // patient → "DXM" | "MDZ"
    view: "matrix",              // matrix | trajectory
    splitByArm: false,
    trajMode: (localStorage.getItem(LS_TRAJMODE) || "codes"), // codes | pca | both
    pcaContextOn: (localStorage.getItem(LS_PCACTX) === "1"),
  };
  for (const f of FACETS) state.scope[f.key] = new Set();
  if (!["codes", "pca", "both"].includes(state.trajMode)) state.trajMode = "codes";

  // ---------- Helpers ----------
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const escapeHTML = (s) =>
    String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

  const labelDay = (d) => {
    if (!d) return d;
    if (d === "DayMinus1") return "Day −1";
    return d.replace(/^Day/, "Day ");
  };

  const labelArm = (a) => a === "DXM" ? "Dexmedetomidine" : a === "MDZ" ? "Midazolam" : a;

  const patientNum = (p) => {
    const m = String(p).match(/(\d+)/);
    return m ? +m[1] : 0;
  };

  function naturalOrder(key, values) {
    const arr = Array.from(values);
    const map = {
      day: DAY_ORDER, theme: THEME_ORDER, stream: STREAM_ORDER,
      arm: ARM_ORDER, discipline: DISCIPLINE_ORDER,
    };
    if (map[key]) {
      const idx = (v) => { const i = map[key].indexOf(v); return i === -1 ? 999 : i; };
      arr.sort((a, b) => idx(a) - idx(b) || a.localeCompare(b));
    } else if (key === "patient") {
      arr.sort((a, b) => {
        const aArm = a.startsWith("DXM") ? 0 : 1;
        const bArm = b.startsWith("DXM") ? 0 : 1;
        return aArm - bArm || patientNum(a) - patientNum(b);
      });
    } else {
      arr.sort((a, b) => a.localeCompare(b));
    }
    return arr;
  }

  function valueLabel(key, v) {
    if (v == null || v === "") return "—";
    if (key === "day") return labelDay(v);
    if (key === "theme") return themeMeta(v).label;
    if (key === "stream") return STREAM_LABEL.get(v) || (v === NO_STREAM.key ? NO_STREAM.label : v);
    return v;
  }

  // ---------- Filtering (scope) ----------
  // Status gate: in-scope only unless the audit toggle is on. Deprecated rows
  // are never removed from the database — this only hides them (D12/D13).
  const passesStatus = (item) => state.showDeprecated || !isDeprecated(item);

  function passesScope(item) {
    if (!passesStatus(item)) return false;
    for (const f of FACETS) {
      const sel = state.scope[f.key];
      if (sel.size && !sel.has(facetValue(item, f.key))) return false;
    }
    return true;
  }

  function activeScope() {
    let n = 0;
    for (const f of FACETS) n += state.scope[f.key].size;
    return n;
  }

  // ---------- Patient → Arm map (used for E1 row tinting) ----------
  function buildPatientArmMap() {
    const out = {};
    for (const it of state.data) {
      if (it.patient && it.arm) out[it.patient] = it.arm;
    }
    // Fallback: infer from ID prefix
    for (const p of new Set(state.data.map(d => d.patient).filter(Boolean))) {
      if (out[p]) continue;
      if (p.startsWith("DXM")) out[p] = "DXM";
      else if (p.startsWith("MDZ")) out[p] = "MDZ";
    }
    state.patientArm = out;
  }

  function armClassForRow(rowDim, rowKey) {
    if (rowDim !== "patient") return "";
    const arm = state.patientArm[rowKey];
    return arm ? ` arm-${arm}` : "";
  }

  // Theme colour CSS var for a cell, used by presence dots
  function cellThemeVar(rk, ck) {
    if (state.rowDim === "theme") return `--${themeMeta(rk).slug}`;
    if (state.colDim === "theme") return `--${themeMeta(ck).slug}`;
    return null;
  }

  // ---------- Pivot ----------
  // armFilter: optional "DXM" | "MDZ" to restrict to a single arm (for split view)
  function pivot(armFilter) {
    const rows = new Map();   // rowKey → Map(colKey → count)
    const colTotals = new Map();
    const rowTotals = new Map();
    let grand = 0;

    const items = [];
    for (const it of state.data) {
      if (!passesScope(it)) continue;
      if (armFilter && it.arm !== armFilter) continue;
      items.push(it);
      const rk = facetValue(it, state.rowDim);
      const ck = facetValue(it, state.colDim);
      if (rk == null || ck == null) continue;
      let r = rows.get(rk);
      if (!r) { r = new Map(); rows.set(rk, r); }
      r.set(ck, (r.get(ck) || 0) + 1);
      colTotals.set(ck, (colTotals.get(ck) || 0) + 1);
      rowTotals.set(rk, (rowTotals.get(rk) || 0) + 1);
      grand++;
    }

    const rowKeys = naturalOrder(state.rowDim, rows.keys());
    const colKeys = naturalOrder(state.colDim, colTotals.keys());

    if (state.sort === "prevalence") {
      rowKeys.sort((a, b) => (rowTotals.get(b) || 0) - (rowTotals.get(a) || 0));
      // Cols by total desc, but keep the fixed-order dimensions natural
      if (!["theme","stream","day","arm","discipline"].includes(state.colDim)) {
        colKeys.sort((a, b) => (colTotals.get(b) || 0) - (colTotals.get(a) || 0));
      }
    }

    return { rows, colTotals, rowTotals, grand, rowKeys, colKeys, items };
  }

  // ---------- Render: counts strip ----------
  function renderCount(items) {
    // Denominator = current status universe, so the count never implies the
    // scope filters are hiding deprecated rows (the status toggle does that).
    const universe = state.data.filter(passesStatus).length;
    const depN = state.data.filter(isDeprecated).length;
    const suffix = state.showDeprecated
      ? ` <span style="color:var(--ink-3)">· incl. ${depN} deprecated</span>`
      : "";
    $("#count").innerHTML = `<strong>${items.length}</strong> of ${universe} quotes${suffix}`;
  }

  function renderMeta(p) {
    const meta = $("#matrixMeta");
    const max = (() => {
      let m = 0;
      for (const r of p.rows.values()) for (const v of r.values()) if (v > m) m = v;
      return m;
    })();
    const rowLbl = FACET_LABEL[state.rowDim];
    const colLbl = FACET_LABEL[state.colDim];
    meta.className = "matrix-meta" + (state.norm === "presence" ? " presence-mode" : "");
    const legend = state.norm === "presence"
      ? `<span class="legend" style="color:var(--ink-3); font-size:11.5px"><span class="pdot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--heat);vertical-align:middle;margin-right:6px"></span>presence (any coded quote)</span>`
      : `<span class="legend"><span>0</span><span class="bar" aria-hidden="true"></span><span class="end">${max}</span></span>`;
    meta.innerHTML = `
      <span><strong>${p.rowKeys.length}</strong> ${escapeHTML(rowLbl).toLowerCase()}${p.rowKeys.length===1?"":"s"} × <strong>${p.colKeys.length}</strong> ${escapeHTML(colLbl).toLowerCase()}${p.colKeys.length===1?"":"s"}</span>
      <span><strong>${p.grand}</strong> coded quotes</span>
      ${legend}
    `;
  }

  // ---------- Render: scope chips ----------
  function renderChips() {
    const wrap = $("#chips");
    const parts = [];
    for (const f of FACETS) {
      const sel = state.scope[f.key];
      if (!sel.size) continue;
      const arr = naturalOrder(f.key, sel);
      const max = 3;
      const shown = arr.slice(0, max).map(v => valueLabel(f.key, v)).join(", ");
      const more = arr.length > max ? ` +${arr.length - max}` : "";
      parts.push(`
        <span class="chip" data-key="${f.key}">
          <span class="k">${escapeHTML(f.label)}:</span>
          <span class="v ${arr.length>1?"has-multi":""}">${escapeHTML(shown)}<span class="more">${more}</span></span>
          <button class="x" type="button" aria-label="Remove ${escapeHTML(f.label)} filter">×</button>
        </span>
      `);
    }
    wrap.innerHTML = parts.join("");
    $("#clearScope").hidden = activeScope() === 0;
  }

  // ---------- Render: matrix ----------
  function heatStyle(value, max) {
    if (state.norm === "presence") return "";    // uniform cells in presence mode
    if (!value || max <= 0) return "";
    const t = Math.min(1, value / max);
    // Mix between paper-2 (cool background) and heat color, with gentle gamma
    const alpha = Math.pow(t, 0.7);
    return `background: color-mix(in srgb, var(--heat) ${Math.round(alpha*32)}%, var(--paper));`;
  }

  function fmt(value, rowTotal, colTotal, rk, ck) {
    if (state.norm === "presence") {
      if (!value) return "";
      const v = cellThemeVar(rk, ck);
      const colour = v ? `var(${v})` : "var(--heat)";
      return `<span class="pdot" style="background:${colour}" title="${value} coded"></span>`;
    }
    if (state.norm === "pctcol") {
      if (!colTotal) return value ? `${value}` : "";
      return value ? `${(value/colTotal*100).toFixed(0)}<span class="pct-suffix">%</span>` : "";
    }
    if (state.norm === "pctrow") {
      if (!rowTotal) return value ? `${value}` : "";
      return value ? `${(value/rowTotal*100).toFixed(0)}<span class="pct-suffix">%</span>` : "";
    }
    return value ? `${value}` : "";
  }

  function colHeaderClass(colKey) {
    if (state.colDim !== "theme") return "";
    return ` col-${themeMeta(colKey).slug}`;
  }

  function renderMatrix(p, tbl) {
    if (!tbl) return;
    tbl.className = "matrix" + (state.norm === "presence" ? " presence" : "");
    if (p.rowKeys.length === 0 || p.colKeys.length === 0) {
      tbl.innerHTML = `<tbody><tr><td><div class="empty"><div class="title">No data in this scope.</div><div>Try removing a scope filter.</div></div></td></tr></tbody>`;
      return;
    }

    // Compute heatmap max
    let max = 0;
    for (const r of p.rows.values()) for (const v of r.values()) if (v > max) max = v;
    if (state.norm === "pctcol") {
      max = 0;
      for (const rk of p.rowKeys) {
        for (const ck of p.colKeys) {
          const v = (p.rows.get(rk)?.get(ck)) || 0;
          const ct = p.colTotals.get(ck) || 0;
          const pct = ct ? v / ct * 100 : 0;
          if (pct > max) max = pct;
        }
      }
    } else if (state.norm === "pctrow") {
      max = 0;
      for (const rk of p.rowKeys) {
        const rt = p.rowTotals.get(rk) || 0;
        for (const ck of p.colKeys) {
          const v = (p.rows.get(rk)?.get(ck)) || 0;
          const pct = rt ? v / rt * 100 : 0;
          if (pct > max) max = pct;
        }
      }
    }

    // Build header
    const rowLbl = FACET_LABEL[state.rowDim];
    const head = `
      <thead>
        <tr>
          <th>${escapeHTML(rowLbl)}</th>
          ${p.colKeys.map(ck => `<th class="${colHeaderClass(ck)}" title="${escapeHTML(ck)}">${escapeHTML(valueLabel(state.colDim, ck))}</th>`).join("")}
          <th class="col-total">Total</th>
        </tr>
      </thead>
    `;

    // Build body — one row per row-dimension value (the retired domain/sub-code
    // grouping went with codebook v1; themes are a flat four-value dimension).
    const bodyRows = [];
    for (const rk of p.rowKeys) {
      const r = p.rows.get(rk) || new Map();
      const rt = p.rowTotals.get(rk) || 0;
      const isThemeRow = state.rowDim === "theme";
      const cssV = isThemeRow ? `--${themeMeta(rk).slug}` : null;
      const armCls = armClassForRow(state.rowDim, rk);
      const depCls = (isThemeRow && rk === NO_THEME.key) ? " row-deprecated" : "";
      bodyRows.push(`
        <tr class="row-label${armCls}${depCls}" data-row="${escapeHTML(rk)}">
          <td>
            <span class="label-row">
              ${cssV ? `<span class="swatch" style="background: var(${cssV})"></span>` : ""}
              <span>${escapeHTML(valueLabel(state.rowDim, rk))}</span>
            </span>
          </td>
          ${p.colKeys.map(ck => {
            const v = r.get(ck) || 0;
            const ct = p.colTotals.get(ck) || 0;
            return `<td class="cell ${v?"":"empty"}" data-row="${escapeHTML(rk)}" data-col="${escapeHTML(ck)}" style="${heatStyle(state.norm==="pctcol" ? (ct?v/ct*100:0) : state.norm==="pctrow" ? (rt?v/rt*100:0) : v, max)}">${fmt(v, rt, ct, rk, ck)}</td>`;
          }).join("")}
          <td class="cell col-total">${state.norm==="count" ? rt : ""}</td>
        </tr>
      `);
    }

    // Footer: column totals
    const footer = `
      <tfoot>
        <tr>
          <td>Total</td>
          ${p.colKeys.map(ck => `<td>${state.norm==="count" ? (p.colTotals.get(ck) || 0) : ""}</td>`).join("")}
          <td>${state.norm==="count" ? p.grand : ""}</td>
        </tr>
      </tfoot>
    `;

    tbl.innerHTML = head + `<tbody>${bodyRows.join("")}</tbody>` + footer;
  }

  // ---------- View dispatcher ----------
  function renderAll() {
    syncControlAvailability();

    const root = $("#viewRoot");

    if (state.view === "trajectory") {
      const p = pivot();
      renderCount(p.items);
      renderChips();
      renderTrajectoryShell(root);
      renderTrajectoryMeta(p.items);
      renderTrajectory(p.items, $("#trajTable"));
      return;
    }

    if (state.splitByArm) {
      const pAll = pivot();         // for the count strip + meta
      renderCount(pAll.items);
      renderChips();
      renderMeta(pAll);
      // Build (or reuse) split shell
      root.innerHTML = `
        <div class="matrix-split" id="splitWrap">
          <section class="split-pane">
            <div class="split-head">
              <span class="arm-tag DXM"><span class="dot"></span>DXM <em style="font-style:normal; color:var(--ink-3); font-size:13px; margin-left:2px;">Dexmedetomidine</em></span>
              <span class="arm-sub" id="splitCountDXM"></span>
            </div>
            <div class="matrix-wrap"><table class="matrix" id="matrixDXM"></table></div>
          </section>
          <section class="split-pane">
            <div class="split-head">
              <span class="arm-tag MDZ"><span class="dot"></span>MDZ <em style="font-style:normal; color:var(--ink-3); font-size:13px; margin-left:2px;">Midazolam</em></span>
              <span class="arm-sub" id="splitCountMDZ"></span>
            </div>
            <div class="matrix-wrap"><table class="matrix" id="matrixMDZ"></table></div>
          </section>
        </div>
      `;
      const pDXM = pivot("DXM");
      const pMDZ = pivot("MDZ");
      $("#splitCountDXM").textContent = `${pDXM.grand} coded · ${pDXM.rowKeys.length} × ${pDXM.colKeys.length}`;
      $("#splitCountMDZ").textContent = `${pMDZ.grand} coded · ${pMDZ.rowKeys.length} × ${pMDZ.colKeys.length}`;
      renderMatrix(pDXM, $("#matrixDXM"));
      renderMatrix(pMDZ, $("#matrixMDZ"));
      return;
    }

    // Single matrix
    if (root.querySelector("#matrix") == null) {
      root.innerHTML = `<div class="matrix-wrap"><table class="matrix" id="matrix"></table></div>`;
    }
    const p = pivot();
    renderCount(p.items);
    renderMeta(p);
    renderChips();
    renderMatrix(p, $("#matrix"));
  }

  // ---------- Drawer ----------
  // ---------- Drawer body rendering ----------
  function quoteCardHTML(it) {
    return `
      <article class="drawer-card${isDeprecated(it) ? " deprecated" : ""}" data-theme="${themeMeta(facetValue(it, "theme")).slug}"
               data-quote="${escapeHTML(it.quote || "")}"
               data-note="${escapeHTML(it.note || "")}">
        <div class="head">
          <div class="domain">${escapeHTML(valueLabel("theme", facetValue(it, "theme")))}</div>
          <div class="id">#${it.id}</div>
        </div>
        <p class="quote">${escapeHTML(it.quote || "")}</p>
        ${it.note ? `<div class="note">${escapeHTML(it.note)}</div>` : ""}
        <div class="meta">
          ${it.stream ? `<span class="pill stream">${escapeHTML(it.stream)}</span>` : ""}
          <span class="pill arm ${escapeHTML(it.arm || "")}">${escapeHTML(it.arm || "—")}</span>
          <span class="pill">${escapeHTML(it.patient || "—")}</span>
          <span class="pill">${escapeHTML(labelDay(it.day) || "—")}</span>
          <span class="pill">${escapeHTML(it.discipline || "—")}</span>
          ${it.subtheme ? `<span class="pill">${escapeHTML(it.subtheme)}</span>` : ""}
          ${it.subcode ? `<span class="pill prov" title="v1 provenance (retired sub-code) — ${escapeHTML(it.code || "")} › ${escapeHTML(it.subcode)}">${escapeHTML(it.subcode)}</span>` : ""}
          ${isDeprecated(it) ? `<span class="pill dep" title="Out of scope under the v3 question — retained for audit">deprecated</span>` : ""}
        </div>
      </article>
    `;
  }

  function pcaContextBlockHTML(sourceFile, sampleQuote) {
    const entry = state.pcaByFile.get(sourceFile);
    if (!entry) {
      // Fallback: no checklist extracted yet for this PCA form
      const p = sampleQuote.patient || "—";
      const d = labelDay(sampleQuote.day) || "—";
      // Try to parse form number from filename "..._Form_N.txt"
      const m = String(sourceFile).match(/Form[_ ](\d+)/);
      const formNum = m ? m[1] : "?";
      return `<div class="pca-context-block missing">PCA form · ${escapeHTML(p)} · ${escapeHTML(d)} · Form ${escapeHTML(formNum)} — checklist not extracted</div>`;
    }
    const score = entry.overall_score;
    const scoreHTML = (typeof score === "number")
      ? `<span class="score" title="Overall comfort score (family/observer rated)">${score}/10</span>`
      : "";
    const reasons = (entry.suspected_reasons || []).filter(r => r && r.trim());
    const reasonsLine = reasons.length
      ? `<div class="ctx-line"><span class="lbl">Ticked</span>${reasons.map(r => `<span class="reason-pill">${escapeHTML(r)}</span>`).join("")}</div>`
      : "";
    const behav = entry.behaviours || {};
    const nonZeroBehav = BEHAVIOUR_ORDER
      .filter(k => k in behav && behav[k] > 0)
      .map(k => `<span class="behav-item">${escapeHTML(k)}<span class="n">${behav[k]}</span></span>`);
    const fullBehavTip = BEHAVIOUR_ORDER
      .filter(k => k in behav)
      .map(k => `${k}: ${behav[k]}`)
      .join(" · ") || "no behavioural scores recorded";
    const behavLine = nonZeroBehav.length
      ? `<div class="ctx-line" title="${escapeHTML(fullBehavTip)}"><span class="lbl">Behaviours</span>${nonZeroBehav.join("")}</div>`
      : "";
    return `
      <div class="pca-context-block">
        <div class="ctx-head">
          PCA form
          <span class="sep">·</span>${escapeHTML(entry.patient || "—")}
          <span class="sep">·</span>${escapeHTML(labelDay(entry.day) || "—")}
          <span class="sep">·</span>Form ${escapeHTML(String(entry.form ?? "?"))}
          ${scoreHTML}
        </div>
        ${reasonsLine}
        ${behavLine}
      </div>
    `;
  }

  function renderDrawerBodyHTML(matched) {
    if (!matched.length) {
      return `<div class="empty"><div class="title">No quotes here.</div></div>`;
    }
    const flatHTML = matched.map(quoteCardHTML).join("");
    // Toggle off OR no PCA quotes in matched → flat list
    const pcaQuotes = matched.filter(it => it.discipline === "PCA" && it.source_file);
    if (!state.pcaContextOn || !pcaQuotes.length) {
      return flatHTML;
    }
    // Group by source_file: PCA-sourced files first (each with context block), then others
    const bySrc = new Map();
    for (const it of matched) {
      const key = it.source_file || "__nofile__";
      if (!bySrc.has(key)) bySrc.set(key, []);
      bySrc.get(key).push(it);
    }
    const pcaKeys = [];
    const otherKeys = [];
    for (const [src, items] of bySrc.entries()) {
      if (items[0]?.discipline === "PCA") pcaKeys.push(src);
      else otherKeys.push(src);
    }
    // Order PCA groups by patient + day for predictability
    pcaKeys.sort((a, b) => {
      const ia = bySrc.get(a)[0], ib = bySrc.get(b)[0];
      return String(ia.patient).localeCompare(String(ib.patient))
          || String(ia.day).localeCompare(String(ib.day))
          || String(a).localeCompare(String(b));
    });

    const pcaGroupsHTML = pcaKeys.map(src => {
      const group = bySrc.get(src);
      return `<div class="pca-form-group">
        ${pcaContextBlockHTML(src, group[0])}
        ${group.map(quoteCardHTML).join("")}
      </div>`;
    }).join("");

    const otherHTML = otherKeys.length
      ? `<div class="pca-other-divider">Other sources</div>${otherKeys.map(src => bySrc.get(src).map(quoteCardHTML).join("")).join("")}`
      : "";

    return pcaGroupsHTML + otherHTML;
  }

  function syncDrawerPcaToggleVisibility(matched) {
    const btn = $("#drawerPcaToggle");
    if (!btn) return;
    const hasPca = matched.some(it => it.discipline === "PCA");
    btn.hidden = !hasPca;
    btn.setAttribute("aria-pressed", state.pcaContextOn ? "true" : "false");
  }

  function openDrawer(rowKey, colKey) {
    const drawer = $("#drawer");
    const matched = state.data.filter(it => {
      if (!passesScope(it)) return false;
      if (facetValue(it, state.colDim) !== colKey) return false;
      return facetValue(it, state.rowDim) === rowKey;
    });

    const rowLbl = escapeHTML(valueLabel(state.rowDim, rowKey));
    const colLbl = escapeHTML(valueLabel(state.colDim, colKey));

    $("#drawerMeta").textContent = `${FACET_LABEL[state.rowDim]} × ${FACET_LABEL[state.colDim]}`;
    $("#drawerTitle").innerHTML = `${rowLbl} <span class="x-mark">×</span> ${colLbl}`;
    $("#drawerSub").textContent = `${matched.length} quote${matched.length===1?"":"s"}`;

    // Reset in-drawer search on each open
    $("#drawerSearch").value = "";
    $("#drawerSearchWrap").classList.remove("has-value");
    state.drawerTotal = matched.length;
    state.drawerVisible = matched.length;
    state.drawerMatched = matched;

    if (matched.length === 0) {
      $("#drawerSearchWrap").style.display = "none";
    } else {
      $("#drawerSearchWrap").style.display = "";
    }
    $("#drawerBody").innerHTML = renderDrawerBodyHTML(matched);
    syncDrawerPcaToggleVisibility(matched);

    document.body.classList.add("drawer-open");
    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
    $("#drawerBackdrop").classList.add("open");
  }
  function closeDrawer() {
    document.body.classList.remove("drawer-open");
    $("#drawer").classList.remove("open");
    $("#drawer").setAttribute("aria-hidden", "true");
    $("#drawerBackdrop").classList.remove("open");
  }

  function escapeRE(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function applyDrawerSearch(q) {
    q = (q || "").trim();
    const wrap = $("#drawerSearchWrap");
    wrap.classList.toggle("has-value", !!q);
    const re = q ? new RegExp(escapeRE(q), "ig") : null;
    let visible = 0;
    const total = $$(".drawer-card", $("#drawerBody")).length;
    $$(".drawer-card", $("#drawerBody")).forEach(card => {
      const quote = card.dataset.quote || "";
      const note  = card.dataset.note  || "";
      const hay = (quote + " " + note).toLowerCase();
      const match = !q || hay.includes(q.toLowerCase());
      card.hidden = !match;
      if (match) visible++;
      // Re-render quote/note text with highlight (or plain text if no query)
      const qEl = card.querySelector(".quote");
      const nEl = card.querySelector(".note");
      if (qEl) {
        qEl.innerHTML = re
          ? escapeHTML(quote).replace(re, m => `<mark>${m}</mark>`)
          : escapeHTML(quote);
      }
      if (nEl) {
        nEl.innerHTML = re
          ? escapeHTML(note).replace(re, m => `<mark>${m}</mark>`)
          : escapeHTML(note);
      }
    });
    // Update the "N quotes" subtitle with match count when filtering
    const sub = $("#drawerSub");
    if (q) {
      sub.textContent = `${visible} of ${total} matching “${q}”`;
    } else {
      sub.textContent = `${total} quote${total===1?"":"s"}`;
    }
  }

  // ---------- Filter popover ----------
  // Long facets that should default to closed (patient has 52 values)
  const POP_DEFAULT_CLOSED = new Set(["patient"]);

  function openFilterPop() {
    const pop = $("#filterPop");
    const counts = scopeAwareCounts();

    const sectionsHTML = FACETS.map(f => {
      const all = new Set(state.data.filter(passesStatus).map(d => facetValue(d, f.key)).filter(Boolean));
      const values = naturalOrder(f.key, all);
      const map = counts[f.key];
      const sel = state.scope[f.key];
      const items = values.map(v => {
        const checked = sel.has(v);
        const n = map.get(v) || 0;
        const lbl = valueLabel(f.key, v);
        const swatch = f.coloured
          ? `<span class="swatch" style="background:var(--${themeMeta(v).slug})"></span>`
          : "";
        return `
          <label class="pop-item" data-facet="${f.key}" data-val="${escapeHTML(v)}" data-checked="${checked}">
            <input type="checkbox" data-facet="${f.key}" data-val="${escapeHTML(v)}" ${checked ? "checked" : ""}>
            ${swatch}
            <span class="label">${escapeHTML(lbl)}</span>
            <span class="n">${n}</span>
          </label>
        `;
      }).join("");
      // Open if user has any selection, OR it's a short facet by default
      const open = sel.size > 0 || !POP_DEFAULT_CLOSED.has(f.key);
      const badge = sel.size ? `<span class="sel-badge">${sel.size}</span>` : `<span class="sel-badge"></span>`;
      return `
        <details class="pop-section" data-section="${f.key}"${open ? " open" : ""}>
          <summary>
            <span class="label">${escapeHTML(f.label)}</span>
            ${badge}
          </summary>
          <div class="pop-options">${items}</div>
        </details>
      `;
    }).join("");

    pop.innerHTML = `
      <input class="pop-search" id="popSearch" placeholder="Search facets…" />
      <div class="pop-body">${sectionsHTML}</div>
    `;
    pop.hidden = false;

    setTimeout(() => $("#popSearch")?.focus(), 0);
  }
  function closeFilterPop() {
    const pop = $("#filterPop");
    pop.hidden = true;
    pop.innerHTML = "";
  }

  // Update count numbers and selected badges in-place — preserves scroll/expand state.
  function refreshPopCountsInPlace() {
    const pop = $("#filterPop");
    if (pop.hidden) return;
    const counts = scopeAwareCounts();
    for (const f of FACETS) {
      const map = counts[f.key];
      const sel = state.scope[f.key];
      $$(`.pop-item[data-facet="${f.key}"]`, pop).forEach(item => {
        const v = item.dataset.val;
        const nEl = item.querySelector(".n");
        if (nEl) nEl.textContent = String(map.get(v) || 0);
        item.dataset.checked = sel.has(v) ? "true" : "false";
      });
      const sec = pop.querySelector(`details[data-section="${f.key}"]`);
      if (sec) {
        const badge = sec.querySelector(".sel-badge");
        if (badge) badge.textContent = sel.size ? String(sel.size) : "";
      }
    }
  }

  function scopeAwareCounts() {
    const out = {};
    for (const f of FACETS) out[f.key] = new Map();
    for (const it of state.data) {
      if (!passesStatus(it)) continue;
      for (const f of FACETS) {
        // Pass all OTHER scope filters
        let ok = true;
        for (const g of FACETS) {
          if (g.key === f.key) continue;
          const sel = state.scope[g.key];
          if (sel.size && !sel.has(facetValue(it, g.key))) { ok = false; break; }
        }
        if (!ok) continue;
        const v = facetValue(it, f.key);
        if (v == null) continue;
        out[f.key].set(v, (out[f.key].get(v) || 0) + 1);
      }
    }
    return out;
  }

  // ---------- E4: Day-trajectory view ----------
  const TRAJ_DAYS = ["DayMinus1", "Day0", "Day1", "Day2"];

  function renderTrajectoryShell(root) {
    root.innerHTML = `
      <div class="traj-legend" id="trajLegend"></div>
      <div class="matrix-wrap">
        <table class="trajectory" id="trajTable"></table>
      </div>
    `;
    const showCodes = state.trajMode === "codes" || state.trajMode === "both";
    const showPca   = state.trajMode === "pca"   || state.trajMode === "both";
    const themeLegend = [...THEMES, ...(state.showDeprecated ? [NO_THEME] : [])];
    const codeItems = showCodes
      ? themeLegend.map(t => `<span><span class="swatch" style="background:var(--${t.slug})"></span>${escapeHTML(t.short)}</span>`).join("")
      : "";
    const pcaItems = showPca
      ? `<span><span class="swatch pca"></span>PCA reason ticked</span>
         <span><span class="swatch score"></span>Cell tint = avg PCA score 0–10</span>`
      : "";
    const note = state.trajMode === "pca"
      ? "PCA mode shows reasons families ticked. Empty cells = no PCA form logged that day."
      : "An empty cell means no coded quote for that day (may also mean off-trial — day availability isn't tracked yet).";
    $("#trajLegend").innerHTML = `
      ${codeItems}
      ${pcaItems}
      <span class="note">${escapeHTML(note)}</span>
    `;
  }

  function renderTrajectoryMeta(items) {
    const meta = $("#matrixMeta");
    meta.className = "matrix-meta";
    const patients = new Set(items.map(it => it.patient).filter(Boolean));
    const pcaCount = state.pcaByFile.size;
    const pcaBit = pcaAvailable()
      ? ` <span>· <strong>${pcaCount}</strong> PCA form${pcaCount===1?"":"s"} logged</span>`
      : "";
    meta.innerHTML = `
      <span><strong>${patients.size}</strong> patient${patients.size===1?"":"s"} × <strong>${TRAJ_DAYS.length}</strong> days</span>
      <span><strong>${items.length}</strong> coded quotes</span>${pcaBit}
    `;
  }

  // PCA helpers ----
  function pcaFormsFor(patient, day) {
    return (state.pcaByPatientDay.get(patient) || new Map()).get(day) || [];
  }
  function pcaReasonsForDay(patient, day) {
    const forms = pcaFormsFor(patient, day);
    const seen = new Map(); // reason -> [form labels that ticked it]
    for (const f of forms) {
      for (const r of (f.suspected_reasons || [])) {
        const key = r.trim();
        if (!key) continue;
        if (!seen.has(key)) seen.set(key, []);
        seen.get(key).push(`Form ${f.form}`);
      }
    }
    return seen;
  }
  function pcaAvgScore(forms) {
    const scores = forms.map(f => f.overall_score).filter(s => typeof s === "number");
    if (!scores.length) return null;
    return scores.reduce((a, b) => a + b, 0) / scores.length;
  }

  function renderTrajectory(items, tbl) {
    // Bucket coded quotes by patient → day → Map<theme, count>
    const buckets = new Map();
    for (const it of items) {
      if (!it.patient || !it.day) continue;
      let pMap = buckets.get(it.patient);
      if (!pMap) { pMap = new Map(); buckets.set(it.patient, pMap); }
      let dMap = pMap.get(it.day);
      if (!dMap) { dMap = new Map(); pMap.set(it.day, dMap); }
      const tk = facetValue(it, "theme");
      dMap.set(tk, (dMap.get(tk) || 0) + 1);
    }

    const showCodes = state.trajMode === "codes" || state.trajMode === "both";
    const showPca   = state.trajMode === "pca"   || state.trajMode === "both";

    // In PCA-only mode, include patients with PCA forms in scope even if they have no coded quotes
    const patientSet = new Set([...buckets.keys()]);
    if (showPca) {
      for (const p of state.pcaByPatientDay.keys()) {
        // Respect arm scope (the only patient-related scope we expose at this level is via items already)
        patientSet.add(p);
      }
    }
    const patients = naturalOrder("patient", patientSet);
    if (patients.length === 0) {
      tbl.innerHTML = `<tbody><tr><td><div class="empty"><div class="title">No data in this scope.</div></div></td></tr></tbody>`;
      return;
    }

    const head = `
      <thead>
        <tr>
          <th>Patient</th>
          ${TRAJ_DAYS.map(d => `<th>${escapeHTML(labelDay(d))}</th>`).join("")}
        </tr>
      </thead>
    `;

    const body = patients.map(p => {
      const armCls = state.patientArm[p] ? ` arm-${state.patientArm[p]}` : "";
      const cells = TRAJ_DAYS.map(d => {
        const dMap = (buckets.get(p) || new Map()).get(d);
        const pcaForms = showPca ? pcaFormsFor(p, d) : [];
        const hasCodes = !!(dMap && dMap.size);
        const hasPca = pcaForms.length > 0;

        // Empty cell only when nothing applies in current mode
        if (!hasCodes && !hasPca) {
          return `<td class="tr-cell empty" data-patient="${escapeHTML(p)}" data-day="${escapeHTML(d)}">&nbsp;</td>`;
        }
        if (showCodes && !showPca && !hasCodes) {
          return `<td class="tr-cell empty" data-patient="${escapeHTML(p)}" data-day="${escapeHTML(d)}">&nbsp;</td>`;
        }
        if (showPca && !showCodes && !hasPca) {
          return `<td class="tr-cell empty" data-patient="${escapeHTML(p)}" data-day="${escapeHTML(d)}">&nbsp;</td>`;
        }

        // Theme chips (only when showCodes)
        let codeChips = "";
        if (showCodes && hasCodes) {
          const arr = [...dMap.entries()].map(([tk, n]) => ({ tk, n, meta: themeMeta(tk) }));
          arr.sort((a, b) => {
            const ai = THEME_ORDER.indexOf(a.tk); const bi = THEME_ORDER.indexOf(b.tk);
            return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi) || b.n - a.n;
          });
          codeChips = arr.map(({ tk, n, meta }) => `
            <span class="tr-chip ${meta.slug}${tk === NO_THEME.key ? " is-deprecated" : ""}" data-theme-key="${escapeHTML(tk)}" title="${escapeHTML(meta.label)} — ${n} coded">
              ${escapeHTML(meta.short)}${n > 1 ? `<span class="n">${n}</span>` : ""}
            </span>
          `).join("");
        }

        // PCA chips + score badge
        let pcaChips = "";
        let scoreAttrs = "";
        let scoreBadge = "";
        if (showPca && hasPca) {
          const reasons = pcaReasonsForDay(p, d);
          pcaChips = [...reasons.entries()].map(([reason, formLabels]) => {
            const tip = formLabels.length === 1
              ? `Ticked on ${formLabels[0]}`
              : `Ticked on ${formLabels.join(", ")}`;
            return `<span class="tr-chip pca" data-pca-reason="${escapeHTML(reason)}" title="${escapeHTML(reason)} — ${escapeHTML(tip)}">${escapeHTML(reason)}</span>`;
          }).join("");
          const avg = pcaAvgScore(pcaForms);
          if (avg !== null) {
            const pct = Math.round(avg * 10); // 0..100
            scoreAttrs = ` data-score-tint="1" style="--score-pct:${pct}"`;
            scoreBadge = `<span class="tr-score-badge" title="Avg overall comfort score across ${pcaForms.length} form${pcaForms.length===1?"":"s"} that day">${avg.toFixed(1)}/10</span>`;
          }
        }

        // Build cell body: code chips on top, PCA row (score + reasons) underneath
        const codeRow = codeChips
          ? `<div class="tr-chips">${codeChips}</div>`
          : "";
        const pcaRow = (scoreBadge || pcaChips)
          ? `<div class="tr-row-pca">${scoreBadge}${pcaChips}</div>`
          : "";
        return `<td class="tr-cell" data-patient="${escapeHTML(p)}" data-day="${escapeHTML(d)}"${scoreAttrs}>${codeRow}${pcaRow}</td>`;
      }).join("");
      return `<tr class="${armCls.trim()}" data-patient="${escapeHTML(p)}">
        <td>${escapeHTML(p)}</td>
        ${cells}
      </tr>`;
    }).join("");

    tbl.innerHTML = head + `<tbody>${body}</tbody>`;
  }

  // Open the drawer scoped to (patient, day) — optionally further by theme
  function openTrajectoryDrawer(patient, day, themeKey) {
    const matched = state.data.filter(it => {
      if (!passesScope(it)) return false;
      if (it.patient !== patient) return false;
      if (it.day !== day) return false;
      if (themeKey && facetValue(it, "theme") !== themeKey) return false;
      return true;
    });

    $("#drawerMeta").textContent = `Patient × Day${themeKey ? " × Theme" : ""}`;
    $("#drawerTitle").innerHTML = `${escapeHTML(patient)} <span class="x-mark">×</span> ${escapeHTML(labelDay(day))}${themeKey ? ` <span class="x-mark">×</span> ${escapeHTML(themeMeta(themeKey).short)}` : ""}`;
    $("#drawerSub").textContent = `${matched.length} quote${matched.length===1?"":"s"}`;
    $("#drawerSearch").value = "";
    $("#drawerSearchWrap").classList.remove("has-value");
    state.drawerTotal = matched.length;
    state.drawerVisible = matched.length;
    state.drawerMatched = matched;

    if (matched.length === 0) {
      $("#drawerSearchWrap").style.display = "none";
    } else {
      $("#drawerSearchWrap").style.display = "";
    }

    // If trajectory cell has PCA forms but no coded quotes, surface form context anyway when toggle is on.
    // Synthesize zero-quote "matched" set isn't possible (we filter from state.data); instead, if there are
    // PCA forms for this patient/day and the toggle is on, prepend the form-context blocks directly.
    let bodyHTML = renderDrawerBodyHTML(matched);
    if (state.pcaContextOn) {
      const forms = pcaFormsFor(patient, day);
      const filesShown = new Set(matched.filter(it => it.discipline === "PCA").map(it => it.source_file));
      const orphanForms = forms.filter(f => !filesShown.has(f.source_file));
      if (orphanForms.length) {
        const orphanHTML = orphanForms.map(f => {
          const fake = { patient: f.patient, day: f.day };
          return `<div class="pca-form-group">${pcaContextBlockHTML(f.source_file, fake)}</div>`;
        }).join("");
        bodyHTML = orphanHTML + bodyHTML;
      }
    }
    $("#drawerBody").innerHTML = bodyHTML;
    syncDrawerPcaToggleVisibility(matched.length ? matched : pcaFormsFor(patient, day).map(() => ({ discipline: "PCA" })));

    document.body.classList.add("drawer-open");
    $("#drawer").classList.add("open");
    $("#drawer").setAttribute("aria-hidden", "false");
    $("#drawerBackdrop").classList.add("open");
  }

  // ---------- Sync control availability ----------
  function syncControlAvailability() {
    // Quick-view segment reflects the two framework matrices; neither is pressed
    // when the user has picked their own row/col pair.
    const current = `${state.rowDim}|${state.colDim}`;
    $$("#quickSeg button").forEach(b => {
      b.setAttribute("aria-pressed", b.dataset.quick === current ? "true" : "false");
    });
    // Deprecated (audit) toggle
    $("#depToggle")?.setAttribute("aria-pressed", state.showDeprecated ? "true" : "false");
    // Row/col dim, sort, norm: hide/grey in trajectory view (they don't apply)
    const trajMode = state.view === "trajectory";
    document.querySelectorAll("#rowDim, #colDim, #normSeg, #sortSeg").forEach(el => {
      el.closest(".ctl")?.classList.toggle("is-disabled", trajMode);
    });
    // Split toggle disabled in trajectory view (trajectory already shows arm via row tint)
    $("#splitToggle")?.classList.toggle("is-disabled", trajMode);
    if (trajMode && state.splitByArm) state.splitByArm = false;
    $("#splitToggle")?.setAttribute("aria-pressed", state.splitByArm ? "true" : "false");
    // View seg
    $$("#viewSeg button").forEach(b => {
      b.setAttribute("aria-pressed", b.dataset.view === state.view ? "true" : "false");
    });
    // Body class drives visibility of trajectory-only controls (.ctl.traj-only)
    document.body.classList.toggle("view-trajectory", trajMode);
    // Hide trajectory mode toggle entirely if no PCA data is present (no point picking PCA/Both)
    const trajCtl = $("#trajModeSeg")?.closest(".ctl");
    if (trajCtl) trajCtl.style.display = pcaAvailable() ? "" : "none";
    // Reflect trajMode pressed state
    $$("#trajModeSeg button").forEach(b => {
      b.setAttribute("aria-pressed", b.dataset.trajmode === state.trajMode ? "true" : "false");
    });
    // Keep the rail's sticky `top` in sync with the controls bar's actual height
    // (so a wrapped controls bar doesn't overlap the rail).
    const cbar = document.querySelector(".controls");
    if (cbar) {
      requestAnimationFrame(() => {
        document.documentElement.style.setProperty("--controls-h-actual", cbar.offsetHeight + "px");
      });
    }
  }

  // ---------- E3: Export ----------
  function todayStamp() {
    const d = new Date();
    const z = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  }

  function csvEscape(s) {
    const v = String(s == null ? "" : s);
    if (/[",\n]/.test(v)) return `"${v.replace(/"/g, '""')}"`;
    return v;
  }

  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
  }

  function pivotToRows(p, armLabel) {
    // Returns { header: [...], rows: [[...], ...], filenamePart }
    const rowLbl = FACET_LABEL[state.rowDim] + (armLabel ? ` (${armLabel})` : "");
    const header = [rowLbl, ...p.colKeys.map(ck => valueLabel(state.colDim, ck)), "Total"];
    const isPresence = state.norm === "presence";
    const rows = p.rowKeys.map(rk => {
      const r = p.rows.get(rk) || new Map();
      const rt = p.rowTotals.get(rk) || 0;
      const cells = p.colKeys.map(ck => {
        const v = r.get(ck) || 0;
        const ct = p.colTotals.get(ck) || 0;
        if (isPresence) return v ? "●" : "";
        if (state.norm === "pctcol") return v && ct ? (v/ct*100).toFixed(0) + "%" : (v ? String(v) : "");
        if (state.norm === "pctrow") return v && rt ? (v/rt*100).toFixed(0) + "%" : (v ? String(v) : "");
        return v ? String(v) : "";
      });
      return [valueLabel(state.rowDim, rk), ...cells, isPresence ? "" : String(rt)];
    });
    // Totals footer
    const totals = ["Total", ...p.colKeys.map(ck => isPresence ? "" : String(p.colTotals.get(ck) || 0)), isPresence ? "" : String(p.grand)];
    rows.push(totals);
    return { header, rows };
  }

  function exportCSV() {
    const lines = [];
    const meta = [`# DREAMS theme matrix · exported ${todayStamp()}`];
    meta.push(`# Rows: ${FACET_LABEL[state.rowDim]} · Columns: ${FACET_LABEL[state.colDim]} · Show: ${state.norm}`);
    meta.push(`# Corpus: ${state.showDeprecated ? "in-scope + deprecated (audit)" : "in-scope only"} · theme labels are working labels, supervisor lock pending`);
    if (activeScope() > 0) {
      const scopeBits = [];
      for (const f of FACETS) if (state.scope[f.key].size) scopeBits.push(`${f.label}=${[...state.scope[f.key]].join("|")}`);
      meta.push(`# Scope: ${scopeBits.join(" · ")}`);
    }
    lines.push(...meta);

    if (state.view === "trajectory") {
      // Patient × Day, cell = semicolon-separated theme list
      const items = state.data.filter(passesScope);
      const buckets = trajectoryBuckets(items);
      const patients = naturalOrder("patient", new Set(items.map(i => i.patient).filter(Boolean)));
      lines.push(["Patient", "Arm", ...TRAJ_DAYS.map(d => labelDay(d))].map(csvEscape).join(","));
      for (const p of patients) {
        const arm = state.patientArm[p] || "";
        const cells = TRAJ_DAYS.map(d => trajectoryCellText(buckets, p, d));
        lines.push([p, arm, ...cells].map(csvEscape).join(","));
      }
      downloadBlob(lines.join("\n") + "\n", `dreams-trajectory-${todayStamp()}.csv`, "text/csv");
      return;
    }

    if (state.splitByArm) {
      const pDXM = pivot("DXM");
      const pMDZ = pivot("MDZ");
      [["DXM", pDXM], ["MDZ", pMDZ]].forEach(([arm, p]) => {
        lines.push("");
        lines.push(`# Arm: ${arm}`);
        const { header, rows } = pivotToRows(p, arm);
        lines.push(header.map(csvEscape).join(","));
        for (const r of rows) lines.push(r.map(csvEscape).join(","));
      });
    } else {
      const p = pivot();
      const { header, rows } = pivotToRows(p);
      lines.push(header.map(csvEscape).join(","));
      for (const r of rows) lines.push(r.map(csvEscape).join(","));
    }
    const fname = `dreams-matrix-${state.rowDim}-x-${state.colDim}-${state.norm}-${todayStamp()}.csv`;
    downloadBlob(lines.join("\n") + "\n", fname, "text/csv");
  }

  function mdEscape(s) { return String(s == null ? "" : s).replace(/\|/g, "\\|"); }

  function mdTable(header, rows) {
    const out = [];
    out.push("| " + header.map(mdEscape).join(" | ") + " |");
    out.push("|" + header.map(() => " --- ").join("|") + "|");
    for (const r of rows) out.push("| " + r.map(mdEscape).join(" | ") + " |");
    return out.join("\n");
  }

  // Shared by both exporters: patient|day → Map<themeKey, count>
  function trajectoryBuckets(items) {
    const buckets = new Map();
    for (const it of items) {
      if (!it.patient || !it.day) continue;
      const k = it.patient + "|" + it.day;
      let m = buckets.get(k);
      if (!m) { m = new Map(); buckets.set(k, m); }
      const tk = facetValue(it, "theme");
      m.set(tk, (m.get(tk) || 0) + 1);
    }
    return buckets;
  }

  function trajectoryCellText(buckets, patient, day) {
    const m = buckets.get(patient + "|" + day);
    if (!m) return "";
    return [...m.entries()]
      .sort((a, b) => THEME_ORDER.indexOf(a[0]) - THEME_ORDER.indexOf(b[0]))
      .map(([tk, n]) => n > 1 ? `${themeMeta(tk).short} (${n})` : themeMeta(tk).short)
      .join("; ");
  }

  function exportMarkdown() {
    const parts = [];
    parts.push(`# DREAMS theme matrix\n_Exported ${todayStamp()}_\n`);
    parts.push(`- **Rows:** ${FACET_LABEL[state.rowDim]}`);
    parts.push(`- **Columns:** ${FACET_LABEL[state.colDim]}`);
    parts.push(`- **Show:** ${state.norm}`);
    parts.push(`- **Corpus:** ${state.showDeprecated ? "in-scope + deprecated (audit view)" : "in-scope only"}`);
    parts.push(`- **Theme labels:** working labels (codebook v2, D14) — supervisor lock pending`);
    if (activeScope() > 0) {
      const scopeBits = [];
      for (const f of FACETS) if (state.scope[f.key].size) scopeBits.push(`${f.label}: ${[...state.scope[f.key]].join(", ")}`);
      parts.push(`- **Scope:** ${scopeBits.join(" · ")}`);
    }
    parts.push("");

    if (state.view === "trajectory") {
      const items = state.data.filter(passesScope);
      const buckets = trajectoryBuckets(items);
      const patients = naturalOrder("patient", new Set(items.map(i => i.patient).filter(Boolean)));
      const header = ["Patient", "Arm", ...TRAJ_DAYS.map(d => labelDay(d))];
      const rows = patients.map(p => {
        const arm = state.patientArm[p] || "";
        const cells = TRAJ_DAYS.map(d => trajectoryCellText(buckets, p, d));
        return [p, arm, ...cells];
      });
      parts.push("## Day-trajectory view\n");
      parts.push(mdTable(header, rows));
      downloadBlob(parts.join("\n") + "\n", `dreams-trajectory-${todayStamp()}.md`, "text/markdown");
      return;
    }

    if (state.splitByArm) {
      for (const arm of ["DXM", "MDZ"]) {
        const p = pivot(arm);
        parts.push(`## Arm: ${arm}\n`);
        const { header, rows } = pivotToRows(p, arm);
        parts.push(mdTable(header, rows));
        parts.push("");
      }
    } else {
      const p = pivot();
      const { header, rows } = pivotToRows(p);
      parts.push(mdTable(header, rows));
    }
    const fname = `dreams-matrix-${state.rowDim}-x-${state.colDim}-${state.norm}-${todayStamp()}.md`;
    downloadBlob(parts.join("\n") + "\n", fname, "text/markdown");
  }

  // ---------- Bootstrap ----------
  async function loadData() {
    try {
      const r = await fetch("coded_quotes.json", { cache: "no-store" });
      if (r.ok) {
        const j = await r.json();
        if (Array.isArray(j) && j.length) return j;
      }
    } catch (_) { /* fall through */ }
    const raw = $("#embedded-data").textContent.trim();
    try { return raw ? JSON.parse(raw) : []; } catch { return []; }
  }

  async function loadPcaChecklist() {
    try {
      const r = await fetch("pca_checklist.json", { cache: "no-store" });
      if (!r.ok) return [];
      const j = await r.json();
      return Array.isArray(j) ? j : [];
    } catch (_) { return []; }
  }

  function buildPcaLookups(entries) {
    state.pcaByFile.clear();
    state.pcaByPatientDay.clear();
    for (const e of entries) {
      if (!e || !e.source_file) continue;
      state.pcaByFile.set(e.source_file, e);
      if (!e.patient || !e.day) continue;
      let dayMap = state.pcaByPatientDay.get(e.patient);
      if (!dayMap) { dayMap = new Map(); state.pcaByPatientDay.set(e.patient, dayMap); }
      const arr = dayMap.get(e.day) || [];
      arr.push(e);
      dayMap.set(e.day, arr);
    }
  }

  function pcaAvailable() { return state.pcaByFile.size > 0; }

  async function init() {
    const [quotes, pca] = await Promise.all([loadData(), loadPcaChecklist()]);
    state.data = quotes;
    buildPcaLookups(pca);
    buildPatientArmMap();
    renderAll();

    // Dim pickers
    $("#rowDim").addEventListener("change", (e) => {
      state.rowDim = e.target.value;
      // If row matches col, swap col to first different
      if (state.rowDim === state.colDim) {
        const fallback = state.rowDim === "arm" ? "theme" : "arm";
        state.colDim = fallback;
        $("#colDim").value = fallback;
      }
      renderAll();
    });
    $("#colDim").addEventListener("change", (e) => {
      state.colDim = e.target.value;
      if (state.colDim === state.rowDim) {
        const fallback = state.colDim === "theme" ? "stream" : "theme";
        state.rowDim = fallback;
        $("#rowDim").value = fallback;
      }
      renderAll();
    });

    // Quick view: the two framework matrices (theme × arm, theme × stream)
    $("#quickSeg").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-quick]");
      if (!b) return;
      const [row, col] = b.dataset.quick.split("|");
      state.rowDim = row; state.colDim = col;
      $("#rowDim").value = row; $("#colDim").value = col;
      if (state.view !== "matrix") state.view = "matrix";
      renderAll();
    });

    // Deprecated (audit) toggle — status flag only, nothing is ever deleted
    $("#depToggle").addEventListener("click", () => {
      state.showDeprecated = !state.showDeprecated;
      if (!state.showDeprecated) {
        // Drop scope selections that only exist in the audit view
        state.scope.theme.delete(NO_THEME.key);
        state.scope.stream.delete(NO_STREAM.key);
      }
      renderAll();
      refreshPopCountsInPlace();
    });

    // Norm seg
    $("#normSeg").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-norm]");
      if (!b) return;
      state.norm = b.dataset.norm;
      $$("#normSeg button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      renderAll();
    });

    // Sort seg
    $("#sortSeg").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-sort]");
      if (!b) return;
      state.sort = b.dataset.sort;
      $$("#sortSeg button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      renderAll();
    });

    // Delegated table click — works for #matrix, split panes, and trajectory
    $("#viewRoot").addEventListener("click", (e) => {
      // Trajectory chip click: drawer scoped to patient × day × theme
      const chip = e.target.closest(".tr-chip");
      if (chip) {
        const cell = chip.closest(".tr-cell");
        if (cell) {
          openTrajectoryDrawer(cell.dataset.patient, cell.dataset.day, chip.dataset.themeKey);
        }
        return;
      }
      // Trajectory cell click (anywhere not on a chip): drawer for whole patient × day
      const tcell = e.target.closest(".tr-cell");
      if (tcell && !tcell.classList.contains("empty")) {
        openTrajectoryDrawer(tcell.dataset.patient, tcell.dataset.day, null);
        return;
      }
      // Regular matrix cell click → drawer
      const cell = e.target.closest("td.cell");
      if (cell && !cell.classList.contains("empty") && !cell.classList.contains("col-total")) {
        openDrawer(cell.dataset.row, cell.dataset.col);
      }
    });

    // View toggle (Matrix / Trajectory)
    $("#viewSeg").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-view]");
      if (!b) return;
      state.view = b.dataset.view;
      renderAll();
    });

    // Trajectory display mode (Codes / PCA / Both) — only relevant in trajectory view
    $("#trajModeSeg").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-trajmode]");
      if (!b) return;
      const mode = b.dataset.trajmode;
      if (!["codes", "pca", "both"].includes(mode)) return;
      state.trajMode = mode;
      try { localStorage.setItem(LS_TRAJMODE, mode); } catch (_) {}
      $$("#trajModeSeg button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      if (state.view !== "trajectory") {
        // Switching display mode implies the user wants trajectory
        state.view = "trajectory";
      }
      renderAll();
    });

    // Drawer PCA context toggle
    $("#drawerPcaToggle").addEventListener("click", () => {
      state.pcaContextOn = !state.pcaContextOn;
      try { localStorage.setItem(LS_PCACTX, state.pcaContextOn ? "1" : "0"); } catch (_) {}
      $("#drawerPcaToggle").setAttribute("aria-pressed", state.pcaContextOn ? "true" : "false");
      // Re-render drawer body using the matched set we stashed on open
      const matched = state.drawerMatched || [];
      let bodyHTML = renderDrawerBodyHTML(matched);
      // If this is a trajectory drawer (we can detect by drawerMeta), re-include orphan PCA forms
      if (state.pcaContextOn && /Patient × Day/.test($("#drawerMeta").textContent || "")) {
        // Parse patient/day from the title — best-effort. Just re-derive by looking at any PCA-discipline quote
        // already in matched; for true orphan cells, the trajectory openTrajectoryDrawer path handles them.
      }
      $("#drawerBody").innerHTML = bodyHTML;
      // Re-apply search filter if active
      const q = $("#drawerSearch").value || "";
      if (q.trim()) applyDrawerSearch(q);
    });

    // Split-by-arm toggle
    $("#splitToggle").addEventListener("click", () => {
      if (state.view === "trajectory") return;   // disabled in trajectory mode
      state.splitByArm = !state.splitByArm;
      $("#splitToggle").setAttribute("aria-pressed", state.splitByArm ? "true" : "false");
      renderAll();
    });

    // Download menu
    const dlWrap = $("#downloadMenu");
    $("#downloadBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      dlWrap.classList.toggle("open");
    });
    dlWrap.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-export]");
      if (!b) return;
      dlWrap.classList.remove("open");
      if (b.dataset.export === "csv") exportCSV();
      else if (b.dataset.export === "md") exportMarkdown();
    });
    document.addEventListener("click", (e) => {
      if (dlWrap.classList.contains("open") && !e.target.closest("#downloadMenu")) {
        dlWrap.classList.remove("open");
      }
    });

    // Drawer close
    $("#drawerClose").addEventListener("click", closeDrawer);
    $("#drawerBackdrop").addEventListener("click", closeDrawer);

    // In-drawer search: filter + highlight within the currently shown quotes
    $("#drawerSearch").addEventListener("input", (e) => applyDrawerSearch(e.target.value));
    $("#drawerSearchClear").addEventListener("click", () => {
      const inp = $("#drawerSearch");
      inp.value = "";
      applyDrawerSearch("");
      inp.focus();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if ($("#drawer").classList.contains("open")) closeDrawer();
        else if (!$("#filterPop").hidden) closeFilterPop();
      }
    });

    // Add filter popover
    $("#addFilter").addEventListener("click", (e) => {
      e.stopPropagation();
      if ($("#filterPop").hidden) openFilterPop();
      else closeFilterPop();
    });
    document.addEventListener("click", (e) => {
      if (!$("#filterPop").hidden && !e.target.closest("#filterPop") && !e.target.closest("#addFilter")) {
        closeFilterPop();
      }
    });
    $("#filterPop").addEventListener("change", (e) => {
      const cb = e.target.closest("input[type=checkbox][data-facet]");
      if (!cb) return;
      const key = cb.dataset.facet;
      const val = cb.dataset.val;
      const sel = state.scope[key];
      if (cb.checked) sel.add(val); else sel.delete(val);
      // Update matrix + chips, then refresh pop counts in place (no DOM rebuild,
      // so scroll position and which sections are open are preserved).
      renderAll();
      refreshPopCountsInPlace();
    });
    // Track which sections the user opened/closed so we can restore on search clear.
    const popUserOpenState = new Map();
    function filterPopBySearch(q) {
      q = q.trim().toLowerCase();
      $$("#filterPop details.pop-section").forEach(sec => {
        let any = false;
        $$(".pop-item", sec).forEach(it => {
          const text = it.querySelector(".label").textContent.toLowerCase();
          const visible = !q || text.includes(q);
          it.style.display = visible ? "" : "none";
          if (visible) any = true;
        });
        sec.style.display = any ? "" : "none";
        // While searching, force-open any section that has matches.
        // When search is empty, restore the user's open state.
        if (q) {
          if (!popUserOpenState.has(sec)) popUserOpenState.set(sec, sec.open);
          sec.open = any;
        } else {
          if (popUserOpenState.has(sec)) {
            sec.open = popUserOpenState.get(sec);
            popUserOpenState.delete(sec);
          }
        }
      });
    }
    $("#filterPop").addEventListener("input", (e) => {
      if (e.target.id === "popSearch") filterPopBySearch(e.target.value);
    });

    // Chip removal
    $("#chips").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      const x = e.target.closest(".x");
      if (chip && x) {
        const key = chip.dataset.key;
        // Click × → remove ALL values for this facet (chip represents the facet)
        state.scope[key].clear();
        renderAll();
      }
    });
    $("#clearScope").addEventListener("click", () => {
      for (const f of FACETS) state.scope[f.key].clear();
      renderAll();
    });

    // Sync colDim disable for current rowDim
    $("#colDim").value = state.colDim;
    $("#rowDim").value = state.rowDim;
  }

  init();
})();
</script>

</body>
</html>
